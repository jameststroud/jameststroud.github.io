# ---------------------------------------------------------------------------
# LAB MEMBERS
#
# To add someone: copy an existing block, change the fields, and (if you have
# one) drop a square photo into src/assets/img/people/.
# If there is no photo yet, just leave `photo` out and a placeholder is used.
#
# `group` must be one of: pi, staff, postdoc, phd, incoming, undergrad, alumni
# ---------------------------------------------------------------------------

- name: James T. Stroud, Ph.D.
  group: pi
  role: Principal Investigator
  photo: james-stroud.jpg
  email: stroud@gatech.edu
  scholar: https://scholar.google.com/citations?user=2QdWvJ4AAAAJ&hl=en
  bio: >
    James is an Assistant Professor in the School of Biological Sciences and the
    Elizabeth Smithgall-Watts Endowed Faculty at Georgia Tech. Originally from 
    London, he completed his undergraduate (Zoology) and Master's (Ecology) in the 
    UK, before moving to Miami, Florida, to earn his PhD (Ecology and Evolution) at 
    Florida International University in 2018. Following that, James completed a 
    postdoc with Dr. Jonathan Losos at Washington University in St. Louis before 
    starting the lab at Georgia Tech in 2023. He founded the Lizard Island 
    long-term eco-evolutionary field study in 2015.

- name: Jon Suh
  group: staff
  role: Lab Manager
  photo: jon-suh.jpg
  email: jsuh88@gatech.edu
  bio: >
    Jon runs the lab: field logistics, permits, equipment, and all 
    aspects of the long-term Lizard Island database. Anything collected on 
    Lizard Island (or in the lab in general) passes through him!

- name: Guillermo Garcia-Costoya, Ph.D.
  group: postdoc
  role: Postdoctoral Fellow
  photo: guille-garciacostoya.jpg
  email: ggarciacostoya@gatech.edu
  scholar: https://scholar.google.com/citations?user=lF2WBG0AAAAJ&hl=en&oi=ao
  bio: >
    Guille joined the lab in June 2026, and will be working with us to integrate
    mechanistic biophysical models into our studies on the evolution of thermal
    ecophysiology in lizards, as well as to tackle some of the big outstanding
    Lizard Island analyses.

- name: Taylor Cooper
  group: phd
  role: PhD Student, Bioinformatics
  photo: taylor-cooper.jpg
  email: tcooper84@gatech.edu
  scholar: https://scholar.google.com/citations?user=Eu77UicAAAAJ&hl=en
  started: Fall 2024
  bio: >
    Taylor started in Fall 2024 and works at the intersection of bioinformatics
    and ecology and evolution. Taylor's PhD is focusing on understanding the
    transcriptomic responses of ectotherms (lizards) to extreme thermal stress,
    and the genomic signatures of selection on Lizard Island.
  award: 'Taylor is supported by an <a href="https://www.nsf.gov/funding/initiatives/grfp">NSF Graduate Research Fellowship</a>.'

- name: Emma Glenn
  group: phd
  role: PhD Student, Biology
  photo: emma-glenn.jpg
  email: eglenn31@gatech.edu
  scholar: https://scholar.google.com/citations?user=FtkPP-8AAAAJ&hl=en
  started: Fall 2025
  bio: >
    Emma started in Fall 2025 and is exploring the physiological mechanisms
    that lizards employ to survive extreme thermal stress, specifically
    extreme cold (sub-CTmin) conditions.
  award: 'Emma is supported by a <a href="https://www.simonsfoundation.org/grant/simons-graduate-fellowships-in-ecology-and-evolution/">Simons Foundation Graduate Fellowship in Ecology and Evolution</a>.'

- name: Sam Clay
  group: phd
  role: PhD Student, Biology
  photo: sam-clay.jpeg
  email: seclay00@gmail.com
  scholar: https://scholar.google.com/citations?user=NibJMVUAAAAJ&hl=en
  started: Fall 2027
  bio: >
    Sam deferred a Fall 2026 start to take up a Fulbright Fellowship in Ecuador,
    and will officially start in the lab in Fall 2027. 
  award: 'Sam is currently in Ecuador, supported by a <a href="https://fulbrightscholars.org/us-scholar-awards/">Fulbright Scholar Program</a> Award.'
    

