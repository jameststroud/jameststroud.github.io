# ---------------------------------------------------------------------------
# LAB MEMBERS
#
# To add someone: copy an existing block, change the fields, and (if you have
# one) drop a square photo into src/assets/img/people/.
# If there is no photo yet, just leave `photo` out and a placeholder is used.
#
# `group` must be one of: pi, staff, postdoc, phd, incoming, undergrad, alumni
# ---------------------------------------------------------------------------

- name: James T. Stroud, Ph.D.
  group: pi
  role: Principal Investigator
  photo: james-stroud.jpg
  email: stroud@gatech.edu
  scholar: https://scholar.google.com/citations?user=2QdWvJ4AAAAJ&hl=en
  bio: >
    James is an Assistant Professor in the School of Biological Sciences and the
    Elizabeth Smithgall-Watts Endowed Faculty at Georgia Tech. He read Zoology at
    the University of Wales and Ecology at Hull, completed his PhD at Florida
    International University with Kenneth Feeley, and was a postdoc with Jonathan
    Losos at Washington University in St. Louis before starting the lab in 2023.
    He founded the Lizard Island long-term study in 2015 and the Lizards on the
    Loose community science programme in Miami.

- name: Jon Suh
  group: staff
  role: Lab Manager
  photo: jon-suh.jpg
  email: jsuh88@gatech.edu
  bio: >
