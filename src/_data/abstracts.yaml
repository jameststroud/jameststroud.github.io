10.1016/j.tree.2020.10.019: >-
  Ecological release, originally conceived as niche expansion following a reduction in interspecific
  competition, may prompt invasion success, morphological evolution, speciation, and other
  ecological and evolutionary outcomes. However, the concept has not been recently reviewed. Here,
  we trace the study of 'ecological release' from its inception through the present day and find
  that current definitions are broad and highly varied. Viewing this development as a potential
  impediment to clear communication and hypothesis testing, we suggest a consensus definition for
  ecological release: niche expansions and shifts when a constraining interspecific interaction is
  reduced or removed. In rationalizing this definition, we highlight the various ways ecological
  release can unfold and address its potential evolutionary consequences.
10.1016/j.tree.2022.09.005: >-
  The idea of 'key innovations' has long been influential in theoretical and empirical approaches to
  understanding adaptive diversification. Despite originally revolving around traits inducing major
  ecological shifts, the key innovation concept itself has evolved, conflating lineage
  diversification with trait-dependent ecological shifts. In this opinion article we synthesize the
  history of the term, clarify the relationship between key innovations and adaptive radiation, and
  propose a return to the original concept of key innovations: the evolution of organismal features
  which permit a species to occupy a previously inaccessible ecological state. Ultimately, we
  suggest an integrative approach to studying key innovations, necessitating experimental approaches
  of form and function, natural history studies of resource use, and phylogenetic comparative
  perspectives.
10.1016/j.tree.2024.02.004: >-
  Although primarily studied through the lens of community ecology, phenomena consistent with
  priority effects appear to be widespread across many different scenarios spanning a broad range of
  spatial, temporal, and biological scales. However, communication between these research fields is
  inconsistent and has resulted in a fragmented co-citation landscape, likely due to the diversity
  of terms used to refer to priority effects across these fields. We review these related terms, and
  the biological contexts in which they are used, to facilitate greater cross-disciplinary cohesion
  in research on priority effects. In breaking down these semantic barriers, we aim to provide a
  framework to better understand the conditions and mechanisms of priority effects, and their
  consequences across spatial and temporal scales.
10.1038/s41467-024-54302-1: >-
  Ecological character displacement, whereby shifts in resource use in the presence of competing
  species leads to adaptive evolutionary divergence, is widely considered an important process in
  community assembly and adaptive radiation. However, most evidence for character displacement has
  been inferred from macro-scale geographic or phylogenetic patterns; direct tests of the underlying
  hypothesis of divergent natural selection driving character displacement in the wild are rare.
  Here, we document character displacement between two ecologically similar lizards (Anolis sagrei
  and A. cristatellus) experiencing novel contact. We identify directional selection during the
  incipient stages of sympatry in a new community that corresponds to repeated trait divergence
  across multiple established sympatric communities. By identifying the role of natural selection as
  character displacement unfolds, we connect how natural selection operating at short timescales may
  drive broader patterns of trait distributions at larger spatial and temporal scales. When similar
  species coexist, they often evolve differences to reduce competition, a process called character
  displacement. This study provides rare evidence of character displacement in action, showing how
  natural selection drives rapid trait changes in lizards when a new competitor arrives.
