10.1002/ece3.1645: >-
  Populations occurring at species' range edges can be locally adapted to unique environmental
  conditions. From a species' perspective, range‐edge environments generally have higher severity
  and frequency of extreme climatic events relative to the range core. Under future climates,
  extreme climatic events are predicted to become increasingly important in defining species'
  distributions. Therefore, range‐edge genotypes that are better adapted to extreme climates
  relative to core populations may be essential to species' persistence during periods of rapid
  climate change. We use relatively simple conceptual models to highlight the importance of locally
  adapted range‐edge populations (leading and trailing edges) for determining the ability of species
  to persist under future climates. Using trees as an example, we show how locally adapted
  populations at species' range edges may expand under future climate change and become more common
  relative to range‐core populations. We also highlight how large‐scale habitat destruction
  occurring in some geographic areas where many species range edge converge, such as biome
  boundaries and ecotones (e.g., the arc of deforestation along the rainforest‐cerrado ecotone in
  the southern Amazonia), can have major implications for global biodiversity. As climate changes,
  range‐edge populations will play key roles in helping species to maintain or expand their
  geographic distributions. The loss of these locally adapted range‐edge populations through
  anthropogenic disturbance is therefore hypothesized to reduce the ability of species to persist in
  the face of rapid future climate change.
10.1002/ece3.1651: "Community ecology is an inherently complicated field, confounded by the conflicting use of fundamental terms. Nearly two decades ago, Fauth et\_al. (1996) demonstrated that imprecise language led to the virtual synonymy of important terms and so attempted to clearly define four keywords in community ecology; “\n<em>community,</em>\n” “\n<em>assemblage,</em>\n” “\n<em>guild,</em>\n” and “\n<em>ensemble</em>\n”. We revisit Fauth et\_al.'s conclusion and discuss how the use of these terms has changed over time since their review. An updated analysis of term definition from a selection of popular ecological textbooks suggests that definitions have drifted away from those encountered pre‐1996, and slightly disagreed with results from a survey of 100 ecology professionals (comprising of academic professors, nonacademic PhDs, graduate and undergraduate biology students). Results suggest that confusion about these terms is still widespread in ecology. We conclude with clear suggestions for definitions of each term to be adopted hereafter to provide greater cohesion among research groups."
10.1002/ecy.2727: >-
  Character displacement may facilitate species coexistence through niche partitioning. However, the
  degree to which character displacement influences broader patterns of community assembly is
  unclear. Here, we capitalize on a natural experiment of community assembly on the oceanic island
  of Bermuda. Over the past century, three species of ecologically similar but distantly
  related<em>Anolis</em>lizards have been introduced to Bermuda where no<em>Anolis</em>has ever
  naturally existed. The Jamaican anole (<em>A. grahami</em>) arrived first in 1905 and dispersed
  rapidly across the island. Five decades later, the Antiguan anole (<em>A. leachii</em>) and the
  Barbadian anole (<em>A. extremus</em>) were introduced to independent locations. In 1991,<em>A.
  leachii</em>and<em>A. extremus</em>were observed to nearly meet at a contact zone, but not yet to
  coexist. We record that subsequent range expansion at this contact zone has been
  asymmetrical;<em>A. leachii</em>invaded the range of<em>A. extremus</em>, but reciprocal invasion
  by<em>A. extremus</em>has not occurred. When in allopatry in Bermuda, both species occupy
  identical ecological space. However,<em>A. leachii</em>underwent rapid ecological character
  displacement to use arboreal habitat when invading the range of<em>A. extremus</em>. These
  findings highlight how character displacement may influence the process of dispersal and drive
  patterns of coexistence and community assembly.
10.1002/jez.2185: >-
  Across the globe terrestrial ectotherms—amphibians and non‐avian reptiles—are facing a range of
  emerging challenges. Increasing global temperatures, in particular, are affecting all aspects of
  ectotherm biology and life history. Embryonic development is a thermally sensitive period of the
  organismal lifecycle, yet the impacts of thermal stress on the early development of ectotherms
  have significantly lagged behind studies of later stages and adult thermal physiology.
  Morphogenesis, the stage where the major anatomical systems are actively forming, is particularly
  sensitive to thermal stress, yet is not studied as often as later stages where growth is the
  primary process happening within the egg. Here, we focus on the effects of thermal stress on the
  first 12 days of development, the stages of morphogenesis, in the lizard <em>Anolis sagrei</em>.
  We examine the resiliency of the early developmental stages to heat stress by incubating eggs at
  temperatures that parallel conditions observed today and predicted over the next 50–100 years of
  projected climate change. Our results suggest that some anole nests are currently at the thermal
  limits for which the early embryonic stages can properly develop. Our results emphasize the
  importance of studying early embryonic stages of development and the importance of studying
  stage‐specific effects of thermal stress on squamate development.
