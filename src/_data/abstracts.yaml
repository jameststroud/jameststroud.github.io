10.17161/randa.v25i3.14316: >-
  Cuban Brown Anoles (Anolis sagrei) are native to Cuba and many Bahamian islands (Schwartz and
  Henderson1991), but the species has an expansive non-native range, having been introduced and
  become established in a number of US states (Florida, Georgia, Louisiana, Texas, California),
  several Lesser Antillean islands (Grenada, St. Vincent, the Grenadines, Barbados), Mexico, Belize,
  Hawaii, Bermuda (Stroud et al. 2017), Taiwan, and Singapore (reviewed in Henderson and Powell
  2009). Recently, two newly discovered populations represent expansion of A. sagrei into the
  Southern Hemisphere for the first time, first in the Pacific coastal town of Guayaquil, Ecuador
  (Amador et al. 2017) and secondly in Rio de Janeiro, Brazil (Oliveira et al. 2018). Herein we
  present further evidence of A. sagrei in the Southern Hemisphere, with the first record of A.
  sagrei on the mid-Atlantic island of Ascension (Fig. 1A). No native terrestrial reptiles occur on
  Ascension, but four other species of lizards have been introduced and are established (Edgar
  2010): Asian House Gecko (Hemidactylus frenatus), Gray’s Leaf-toed Gecko (H. mercatorius), Cradock
  Thick-toed Gecko (Pachydactylis geitje), and Weigmann’s Swift (Liolaemus wiegmanni).
