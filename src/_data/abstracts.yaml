2017-martin-herpetofauna-central-uzbekistan: >-
  The diverse habitats of central Uzbekistan support a rich herpetofaunal community, but
  distributions and relative abundances of the species comprising this community remain poorly
  known. Here, we present an annotated species inventory of this under-explored area, with detailed
  notes on distributions and population statuses. Fieldwork was concentrated in southern Navoi and
  western Samarkand provinces, although some records were also made in the far north of Navoi
  province, near the city of Uchkuduk. Data were collected between March and May/June in 2011, 2012,
  and 2013, with herpetofaunal records being made opportunistically throughout this period. Survey
  effort was concentrated in semi-desert steppe habitats, especially the Karnabchul steppe area
  located to the south of the city of Navoi and an expanse of unnamed steppe located to the north of
  Navoi. Further records were made in a range of other habitat types, notably wetlands, sand dune
  fields, and low rocky mountains. Total fieldwork equated to approximately 8,680 person-hours of
  opportunistic survey effort. In total, we detected two amphibian and 26 reptile species in our
  study area, including one species classified as Globally Vulnerable by the IUCN. We present
  distributional data supporting the first record of regional range extensions of five species from
  within our study area. Our results represent the most detailed data concerning reptile and
  amphibian diversity and distributions produced from Uzbekistan in recent years. We conclude by
  recommending that further, systemized survey work needs to be conducted within the area to
  supplement our findings with more robust estimates of species abundances supported by more
  detailed information on species-habitat relationships.
2019-giery-geographic-variation-trophic-ecology-brown-anole: >-
  Here we analyze a large dataset of the diet of the brown anole (<em>Anolis sagrei</em>). We asked
  how the trophic niche varies among populations with the specific goal of testing a long-standing
  model of adaptive diversification – ecological release. Our results do not support the predicted
  inverse relationship between community richness and niche breadth. Instead, we find that
  population niche breadth increases with increasing community richness. Using a subset of data for
  which we have individual-level data we also find that variation in niche structure along this
  community richness gradient is driven by increasing variation within and among individuals. Our
  results show that a widely cited dynamic underpinning ecological models of adaptive
  diversification – ecological release – does not appear to explain interpopulation niche variation
  in <em>A. sagrei</em>. While we do not have data sufficient to explain this incongruence between
  theory and observation, we briefly discuss some ideas worth exploring. Ultimately, we hope our
  findings stimulate new ideas and further evaluation of the relationship between community
  richness, competition, and the origins of intrapopulation diversity.
2019-mantilla-histopathology-large-epidermal-cysts-invasive-puerto: >-
  Large masses were observed on the head and bodies of non-native Puerto Rican crested anoles
  (<em>Anolis cristatellus</em>) in Miami, Florida USA. Following examination, the masses were found
  to be epidermal inclusion cysts. The cysts did not appear to interfere with body condition or
  behavior. This is the first record of epidermal inclusion cysts in <em>A. cristatellus</em> in
  either the native (Puerto Rico) or non-native (Florida) range.
2019-maurer-nocturnal-activity-antiguan-lizards-under-artificial: >-
  Widespread human development has led to the proliferation of artificial light at night, an
  increasingly recognized but poorly understood component of anthropogenic global change. Animals
  specialized to diurnal activity are presented opportunities to use this night-light niche, but the
  ecological consequences are largely unknown. While published records make note of nocturnal
  activity in a diversity of diurnal taxa, few case studies have gone beyond isolated observations
  to quantify patterns of nocturnal activity, document animal behavior, and describe new species
  interactions. From 13 June to 15 July 2017, we conducted hourly nocturnal surveys to assess how
  two species of diurnal <em>Anolis</em> lizards (Leach’s Anole, <em>Anolis leachii</em>, and Watt’s
  Anole, <em>A. wattsi</em>) use artificial light on Long Island, Antigua. Our data show that both
  anole species foraged in artificially illuminated habitats and were more active prior to sunrise
  compared to the early night. Mark-resight data for a focal species, <em>A. leachii</em>, suggest
  that patterns of nocturnal activity were not significantly different between individuals. Finally,
  our behavioral observations for the two anoles and a third lizard species, the nocturnal
  Thick-tailed Gecko (<em>Thecadactylus rapicauda</em>), reveal a lack of agonistic interactions.
  Our study reveals an altered temporal niche for two diurnal Antiguan lizards and adds to a growing
  body of evidence documenting the broad influences of anthropogenic change on biodiversity.
2019-mothes-predicting-invasion-dynamics-anoles-other-lizards: >-
  Ecological niche models are commonly used to predict areas of environmental suitability for
  non-native species. Depending on these models to enact appropriate management plans assumes that
  they are accurate, however most niche model studies do not provide appropriate validation. South
  Florida hosts the world’s largest and most globally diverse non-native lizard community, providing
  a unique opportunity to evaluate the predictive ability of niche models by comparing model
  predictions to observed patterns of dispersal, abundance, and physiology in established non-native
  populations. Using Maxent, we developed niche models for 30 non-native lizard species established
  within Miami-Dade County, FL, including all 8 established non-native <em>Anolis</em> species,
  using native range data to project suitability in the invaded range. We then compared projections
  to data available on distribution, as well as empirically collected data on abundance and
  physiology (upper and lower thermal tolerances). Maxent performed well in predicting general
  invasion patterns of non-native species across geographic space, however performed poorly in
  predicting the relative invasion success of each species. Additionally, comparisons between
  predicted and observed thermal tolerances showed that most of the models overpredicted the range
  of suitable thermal habitat for each species. Overall, the niche models accurately predicted
  geographic hotspots for these species to occur but could not predict relative invasion success of
  each species individually. These results suggest that other factors, such as time since
  introduction, dispersal ability, biotic interactions, adaptation, and source populations may also
  influence the relative success of non-native species after they become established.
