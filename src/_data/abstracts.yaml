10.1038/s44260-026-00069-z: >-
  The emergence of phototrophy is one of the most significant innovations in the history of life,
  vastly increasing available metabolic energy. Phototrophy is, however, known to have arisen only
  twice. This raises a curious question: if phototrophy was accessible enough to evolve twice, why
  has it never arisen again despite billions of years of subsequent evolution? Through physiological
  modeling, we demonstrate that chlorophototrophy and retinalophototrophy together saturate the
  bioenergetic landscape available to light-harvesting systems. They represent opposite solutions to
  key biophysical trade-offs: maximizing efficiency per photon versus maximizing metabolic flux,
  specialization versus versatility, and sophistication versus simplicity. Together they create an
  evolutionary priority effect, blocking any newly-arising phototrophic system from succeeding. By
  revealing the basis of this competitive exclusion, our work sheds light on a general principle -
  that early innovations can saturate ecological space such that they constrain future evolutionary
  possibilities, making apparently ‘easy’ innovations appear as rare events.
10.1073/pnas.2000801117: >-
  Extreme climate events such as droughts, cold snaps, and hurricanes can be powerful agents of
  natural selection, producing acute selective pressures very different from the everyday pressures
  acting on organisms. However, it remains unknown whether these infrequent but severe disruptions
  are quickly erased by quotidian selective forces, or whether they have the potential to durably
  shape biodiversity patterns across regions and clades. Here, we show that hurricanes have enduring
  evolutionary impacts on the morphology of anoles, a diverse Neotropical lizard clade. We first
  demonstrate a transgenerational effect of extreme selection on toepad area for two populations
  struck by hurricanes in 2017. Given this short-term effect of hurricanes, we then asked whether
  populations and species that more frequently experienced hurricanes have larger toepads. Using 70
  y of historical hurricane data, we demonstrate that, indeed, toepad area positively correlates
  with hurricane activity for both 12 island populations of

  <em>Anolis sagrei</em>

  and 188

  <em>Anolis</em>

  species throughout the Neotropics. Extreme climate events are intensifying due to climate change
  and may represent overlooked drivers of biogeographic and large-scale biodiversity patterns.
