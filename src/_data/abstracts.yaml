10.1002/ece3.1645: >-
  Populations occurring at species' range edges can be locally adapted to unique environmental
  conditions. From a species' perspective, range‐edge environments generally have higher severity
  and frequency of extreme climatic events relative to the range core. Under future climates,
  extreme climatic events are predicted to become increasingly important in defining species'
  distributions. Therefore, range‐edge genotypes that are better adapted to extreme climates
  relative to core populations may be essential to species' persistence during periods of rapid
  climate change. We use relatively simple conceptual models to highlight the importance of locally
  adapted range‐edge populations (leading and trailing edges) for determining the ability of species
  to persist under future climates. Using trees as an example, we show how locally adapted
  populations at species' range edges may expand under future climate change and become more common
  relative to range‐core populations. We also highlight how large‐scale habitat destruction
  occurring in some geographic areas where many species range edge converge, such as biome
  boundaries and ecotones (e.g., the arc of deforestation along the rainforest‐cerrado ecotone in
  the southern Amazonia), can have major implications for global biodiversity. As climate changes,
  range‐edge populations will play key roles in helping species to maintain or expand their
  geographic distributions. The loss of these locally adapted range‐edge populations through
  anthropogenic disturbance is therefore hypothesized to reduce the ability of species to persist in
  the face of rapid future climate change.
10.1002/ece3.1651: "Community ecology is an inherently complicated field, confounded by the conflicting use of fundamental terms. Nearly two decades ago, Fauth et\_al. (1996) demonstrated that imprecise language led to the virtual synonymy of important terms and so attempted to clearly define four keywords in community ecology; “\n<em>community,</em>\n” “\n<em>assemblage,</em>\n” “\n<em>guild,</em>\n” and “\n<em>ensemble</em>\n”. We revisit Fauth et\_al.'s conclusion and discuss how the use of these terms has changed over time since their review. An updated analysis of term definition from a selection of popular ecological textbooks suggests that definitions have drifted away from those encountered pre‐1996, and slightly disagreed with results from a survey of 100 ecology professionals (comprising of academic professors, nonacademic PhDs, graduate and undergraduate biology students). Results suggest that confusion about these terms is still widespread in ecology. We conclude with clear suggestions for definitions of each term to be adopted hereafter to provide greater cohesion among research groups."
