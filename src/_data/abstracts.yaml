  Character displacement may facilitate species coexistence through niche partitioning. However, the
  degree to which character displacement influences broader patterns of community assembly is
  unclear. Here, we capitalize on a natural experiment of community assembly on the oceanic island
  of Bermuda. Over the past century, three species of ecologically similar but distantly
  related<em>Anolis</em>lizards have been introduced to Bermuda where no<em>Anolis</em>has ever
  naturally existed. The Jamaican anole (<em>A. grahami</em>) arrived first in 1905 and dispersed
  rapidly across the island. Five decades later, the Antiguan anole (<em>A. leachii</em>) and the
  Barbadian anole (<em>A. extremus</em>) were introduced to independent locations. In 1991,<em>A.
  leachii</em>and<em>A. extremus</em>were observed to nearly meet at a contact zone, but not yet to
  coexist. We record that subsequent range expansion at this contact zone has been
  asymmetrical;<em>A. leachii</em>invaded the range of<em>A. extremus</em>, but reciprocal invasion
  by<em>A. extremus</em>has not occurred. When in allopatry in Bermuda, both species occupy
  identical ecological space. However,<em>A. leachii</em>underwent rapid ecological character
  displacement to use arboreal habitat when invading the range of<em>A. extremus</em>. These
  findings highlight how character displacement may influence the process of dispersal and drive
  patterns of coexistence and community assembly.
10.1002/jez.2185: >-
  Across the globe terrestrial ectotherms—amphibians and non‐avian reptiles—are facing a range of
  emerging challenges. Increasing global temperatures, in particular, are affecting all aspects of
  ectotherm biology and life history. Embryonic development is a thermally sensitive period of the
  organismal lifecycle, yet the impacts of thermal stress on the early development of ectotherms
  have significantly lagged behind studies of later stages and adult thermal physiology.
  Morphogenesis, the stage where the major anatomical systems are actively forming, is particularly
  sensitive to thermal stress, yet is not studied as often as later stages where growth is the
  primary process happening within the egg. Here, we focus on the effects of thermal stress on the
  first 12 days of development, the stages of morphogenesis, in the lizard <em>Anolis sagrei</em>.
  We examine the resiliency of the early developmental stages to heat stress by incubating eggs at
  temperatures that parallel conditions observed today and predicted over the next 50–100 years of
  projected climate change. Our results suggest that some anole nests are currently at the thermal
  limits for which the early embryonic stages can properly develop. Our results emphasize the
  importance of studying early embryonic stages of development and the importance of studying
  stage‐specific effects of thermal stress on squamate development.
10.1007/s10530-017-1389-1: >-
  Bermuda is an isolated, oceanic island with only one endemic terrestrial vertebrate, the
  Critically Endangered Bermuda skink (<em>Plestiodon longirostris</em>; Squamata, Scincidae). Major
  declines in <em>P. longirostris</em> populations have been caused primarily by habitat loss and
  mortality via invasive species (e.g., predation from birds and cats) and human waste products
  (e.g., trapped in discarded bottles). However, biotic interactions and interspecific competition
  with invasive lizards have also been identified as potentially detrimental to <em>P.
  longisrostris</em> populations. Here, we provide the first occurrence records of a highly invasive
  lizard, the Cuban brown anole (<em>Anolis sagrei</em>), on Bermuda. We assess the brown anole’s
  diet, habitat use, morphology, and island-wide distribution for comparison to the native skink,
  <em>P. longirostris</em>. Results of this study indicate that <em>A. sagrei</em> in Bermuda are
  highly terrestrial (>60% of all lizards observed on the ground vs. in trees) and forage primarily
  on terrestrial invertebrates. These data indicate substantial ecological overlap with the
  exclusively-terrestrial <em>P. longirostris</em>. This is in contrast to the other established
  non-native lizards on Bermuda, which are principally arboreal and have successfully coexisted with
  <em>P. longirostris</em> for >60 years. At present, the geographic distributions of <em>A.
  sagrei</em> and <em>P. longirostris</em> do not overlap. However, all extant skink populations are
  within several kilometers of brown anole populations (with the nearest being <0.5 km). The
  extensive overlap in ecological niche between the Bermuda skink and the invasive brown anole will
  likely present a serious conservation threat if contact is made. This study is exceptional in
  providing clear in situ ecological data which predict a conservation threat of an established
  invasive species to a Critically Endangered island endemic prior to coexistence. Continued
  monitoring of this situation as <em>P. longirostris</em> and <em>A. sagrei</em> inevitably come
  into contact will allow these a priori hypotheses of conservation risk via ecological overlap to
  be tested.
10.1007/s10980-016-0362-1: >-
  Context: Urban landscapes are a mixture of built structures, human-altered vegetation, and remnant
  semi-natural areas. The spatial arrangement of abiotic and biotic conditions resulting from
  urbanization doubtless influences the establishment and spread of non-native species in a city.

  Objectives: We investigated the effects of habitat structure, thermal microclimates, and species
  coexistence on the spread of a non-native lizard (<em>Anolis cristatellus</em>) in the Miami
  metropolitan area of South Florida (USA).

  Methods: We used transect surveys to estimate lizard occurrence and abundance on trees and to
  measure vegetation characteristics, and we assessed forest cover and impervious surface using GIS.
  We sampled lizard body temperatures, habitat use, and relative abundance at multiple sites.

  Results: At least one of five <em>Anolis</em> species occupied 79% of the 1035 trees surveyed in
  primarily residential areas, and non-native <em>A. cristatellus</em> occupied 25% of trees.
  Presence and abundance of <em>A. cristatellus</em> were strongly associated with forest patches,
  dense vegetation, and high canopy cover, which produced cooler microclimates suitable for this
  species. Presence of <em>A. cristatellus</em> was negatively associated with the ecologically
  similar non-native <em>A. sagrei</em>, resulting in reduced abundance and a shift in perch use of
  <em>A. cristatellus</em>.

  Conclusions: The limited spread of <em>A. cristatellus</em> in Miami over 35 years is due to the
  patchy, low-density distribution of wooded habitat, which limits dispersal by diffusion. The
  presence of congeners may also limit spread. Open habitats—some parks, yards and roadsides—contain
  few if any <em>A. cristatellus</em>, and colonization of isolated forest habitat appears to depend
  on human-mediated dispersal.
10.1007/s11252-019-0831-9: >-
  Understanding how novel environmental conditions presented by urbanization affect the ecology and
  behavior of species is an important component of global change biology. Behavior is the first way
  in which organisms respond to novel conditions. We investigated differences in habitat use,
  movement, and social behavior of invasive adult male Cuban brown anoles (<em>Anolis sagrei</em>)
  in natural and urban areas in Miami, FL. We observed that urban lizards used broader perches and
  frequented more artificial human-made substrates (e.g. walls) than lizards in a natural forest
  habitat. Extensive behavioral observations (ca. 1200 min) revealed that urban <em>A. sagrei</em>
  also performed more dewlap displays, changed perches less, and jumped less. Our analysis of the
  structural environment revealed that urban areas are more open – in other words, have higher
  visibility at typical lizard perch heights, and have fewer and broader perches than natural areas.
  An increase in openness may explain why we observed a greater than two-fold increase in the
  frequency of dewlap displaying – the primary mechanism of visual communication in anoles.
  Similarly, less perch changes and fewer jumps – a form of locomotion frequently used in
  perch-perch movement when perches are close – is likely driven by a three-fold decrease in tree
  density. Understanding how behavior and ecology differ in urban vs. natural ecosystems provides
  insight into how species persist in urban landscapes, and how such behavioral shifts might
  facilitate biological invasions.
