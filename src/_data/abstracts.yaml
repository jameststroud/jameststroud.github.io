10.1093/iob/obab033: >-
  Every stage of organismal life history is being challenged by global warming. Many species are
  already experiencing temperatures approaching their physiological limits; this is particularly
  true for ectothermic species, such as lizards. Embryos are markedly sensitive to thermal insult.
  Here, we demonstrate that temperatures currently experienced in natural nesting areas can modify
  gene expression levels and induce neural and craniofacial malformations in embryos of the lizard
  Anolis sagrei. Developmental abnormalities ranged from minor changes in facial structure to
  significant disruption of anterior face and forebrain. The first several days of postoviposition
  development are particularly sensitive to this thermal insult. These results raise new concern
  over the viability of ectothermic species under contemporary climate change. Herein, we propose
  and test a novel developmental hypothesis that describes the cellular and developmental origins of
  those malformations: cell death in the developing forebrain and abnormal facial induction due to
  disrupted Hedgehog signaling. Based on similarities in the embryonic response to thermal stress
  among distantly related species, we propose that this developmental hypothesis represents a common
  embryonic response to thermal insult among amniote embryos. Our results emphasize the importance
  of adopting a broad, multidisciplinary approach that includes both lab and field perspectives when
  trying to understand the future impacts of anthropogenic change on animal development.
10.1093/jhered/esz055: >-
  Understanding the origins and early stages of diversification is one of the most elusive tasks in
  adaptive radiation research. Classical approaches, which aim to infer past processes from
  present-day patterns of biological diversity, are fraught with difficulties and assumptions. An
  alternative approach has been to study young clades of relatively few species, which may represent
  the putative early stages of adaptive radiation. However, it is difficult to predict whether those
  groups will ever reach the ecological and morphological disparity observed in the sorts of clades
  usually referred to as adaptive radiations, thereby making their utility in informing the early
  stages of such radiations uncertain. Caribbean Anolis lizards are a textbook example of an
  adaptive radiation; anoles have diversified independently on each of the 4 islands in the Greater
  Antilles, producing replicated radiations of phenotypically diverse species. However, the
  underlying processes that drove these radiations occurred 30–65 million years ago and so are
  unobservable, rendering major questions about how these radiations came to be difficult to tackle.
  What did the ancestral species of the anole radiation look like? How did new species arise? What
  processes drove adaptive diversification? Here, we review what we have learned about the cryptic
  early stages of adaptive radiation from studies of Anolis lizards, and how these studies have
  attempted to bridge the process-pattern divide of adaptive radiation research. Despite decades of
  research, however, fundamental questions linking eco-evolutionary processes to macroevolutionary
  patterns in anoles remain difficult to answer.
10.1093/jhered/esz064: >-
  Adaptive radiation plays a fundamental role in our understanding of the evolutionary process.
  However, the concept has provoked strong and differing opinions concerning its definition and
  nature among researchers studying a wide diversity of systems. Here, we take a broad view of what
  constitutes an adaptive radiation, and seek to find commonalities among disparate examples,
  ranging from plants to invertebrate and vertebrate animals, and remote islands to lakes and
  continents, to better understand processes shared across adaptive radiations. We surveyed many
  groups to evaluate factors considered important in a large variety of species radiations. In each
  of these studies, ecological opportunity of some form is identified as a prerequisite for adaptive
  radiation. However, evolvability, which can be enhanced by hybridization between distantly related
  species, may play a role in seeding entire radiations. Within radiations, the processes that lead
  to speciation depend largely on (1) whether the primary drivers of ecological shifts are (a)
  external to the membership of the radiation itself (mostly divergent or disruptive ecological
  selection) or (b) due to competition within the radiation membership (interactions among members)
  subsequent to reproductive isolation in similar environments, and (2) the extent and timing of
  admixture. These differences translate into different patterns of species accumulation and
  subsequent patterns of diversity across an adaptive radiation. Adaptive radiations occur in an
  extraordinary diversity of different ways, and continue to provide rich data for a better
  understanding of the diversification of life.
10.1093/sysbio/syab041: >-
  The evolution of key innovations—unique features that enable a lineage to interact with the
  environment in a novel way—may drive broad patterns of adaptive diversity. However, traditional
  tests of the key innovation hypothesis, those which attempt to identify the evolutionary effect of
  a purported key innovation by comparing patterns of diversity between lineages with and without
  the key trait, have been challenged on both conceptual and statistical grounds. Here, we explore
  alternative, untested hypotheses of the key innovation framework. In lizards, adhesive toepad
  structures increase grip strength on vertical and smooth surfaces such as tree trunks and leaves
  and have independently evolved multiple times. As such, toepads have been posited as a key
  innovation for the evolution of arboreality. Leveraging a habitat use data set applied to a global
  phylogeny of 2692 lizard species, we estimated multiple origins of toepads in three major clades
  and more than 100 origins of arboreality widely across the phylogeny. Our results suggest that
  toepads arise adaptively in arboreal lineages and are subsequently rarely lost while maintaining
  arboreal ecologies. Padless lineages transition away from arboreality at a higher rate than those
  with toepads, and high rates of invasion of arboreal niches by nonarboreal padbearing lineages
  provide further evidence that toepads may be a key to unlocking evolutionary access to the
  arboreal zone. Our results and analytical framework provide novel insights to understand and
  evaluate the ecological and evolutionary consequences of key innovations.[Arboreality; ecological
  transition; key innovation; macroevolution; phylogenetic comparative methods.]
10.1098/rsbl.2020.0625: >-
  Extreme climate events are predicted to increase in frequency and severity due to contemporary
  climate change. Recent studies have documented the evolutionary impacts of extreme events on
  single species, but no studies have yet investigated whether such events can drive community-wide
  patterns of trait shifts. On 22 January 2020, subtropical south Florida experienced an extreme
  cold episode during which air temperatures dropped below the lower thermal limit of resident
  lizard populations. In the week immediately after the cold event, we documented decreased lower
  thermal limits (CTmin) of six co-occurring lizard species that vary widely in ecology, body size
  and thermal physiology. Although cold tolerance of these species differed significantly before the
  cold snap, lizards sampled immediately after had converged on the same new, lower limit of thermal
  tolerance. Here, we demonstrate that extreme climate events can drive substantial and synchronous
  community-wide trait changes and provide evidence that tropical and subtropical ectotherms—often
  characterized as unable to withstand rapid changes in climatic conditions—can endure climatic
  conditions that exceed their physiological limits. Future studies investigating the mechanisms
  driving these trait shifts will prove valuable in understanding the ability of ectotherm
  communities to mitigate climate change.
10.1098/rsbl.2023.0160: >-
  Positive allometry of signalling traits has often been taken as evidence for sexual selection.
  However, few studies have explored interspecific differences in allometric scaling relationships
  among closely related species that vary in their degree of ecological
  similarity.<em>Anolis</em>lizards possess an elaborate retractable throat fan called a dewlap that
  is used for visual communication and differs greatly in size and colour among species. We observed
  that<em>Anolis</em>dewlaps demonstrate positive allometry: relative dewlap size increases with
  body size. We also observed that coexisting species are divergent in signal size allometries,
  while convergent species—similar in other aspects of ecology, morphology and behaviour—typically
  share similar dewlap allometric scaling relationships. These patterns suggest that dewlap scaling
  relationships may follow the same pattern as other traits in the anole radiation, where
  ecologically different sympatric species have evolved a suite of divergent traits.
10.1098/rstb.2017.0390: >-
  Functional traits are increasingly used to understand the ecology of plants and to predict their
  responses to global changes. Unfortunately, trait data are unavailable for the majority of plant
  species. The lack of trait data is especially prevalent for hard-to-measure traits and for
  tropical plant species, potentially owing to the many inherent difficulties of working with
  species in remote, hyperdiverse rainforest systems. The living collections of botanic gardens
  provide convenient access to large numbers of tropical plant species and can potentially be used
  to quickly augment trait databases and advance our understanding of species' responses to climate
  change. In this review, we quantitatively assess the availability of trait data for tropical
  versus temperate species, the diversity of species available for sampling in several exemplar
  tropical botanic gardens and the validity of garden-based leaf and root trait measurements. Our
  analyses support the contention that the living collections of botanic gardens are a valuable
  scientific resource that can contribute significantly to research on plant functional ecology and
  conservation.


  This article is part of the theme issue ‘Biological collections for understanding biodiversity in
  the Anthropocene’.
10.1111/1365-2656.13182: >-
  Seasonal changes in reproduction have been described for many taxa. As reproductive seasons
  progress, females often shift from greater energetic investment in many small offspring towards
  investing less total energy into fewer, better provisioned (i.e. larger) offspring. The underlying
  causes of this pattern have not been assessed in many systems.


  Two primary hypotheses have been proposed to explain these patterns. The first is an adaptive
  hypothesis from life‐history theory: early offspring have a survival advantage over those produced
  later. Accordingly, selection favours females that invest in offspring quantity early in the
  season and offspring quality later. The second hypothesis suggests these patterns are not
  intrinsic but result from passive responses to seasonal changes in the environment experienced by
  reproducing females (i.e. maternal environment).


  To disentangle the causes underlying this pattern, which has been reported in brown anole lizards
  (<em>Anolis sagrei</em>), we performed complementary field and laboratory studies. The laboratory
  study carefully controlled maternal environments and quantified reproductive patterns throughout
  the reproductive season for each female. The field study measured similar metrics from free
  ranging lizards across an entire reproductive season.


  In the laboratory, females increased relative effort per offspring as the reproductive season
  progressed; smaller eggs were laid earlier, larger eggs were laid later. Moreover, we observed
  significant among‐individual variation in seasonal changes in reproduction, which is necessary for
  traits to evolve via natural selection. Because these patterns consistently emerge under
  controlled laboratory conditions, they likely represent an intrinsic and potentially adaptive
  adjustment of reproductive effort as predicted by life‐history theory.


  The field study revealed similar trends, further suggesting that intrinsic patterns observed in
  the laboratory are strong enough to persist despite the environmental variability that
  characterizes natural habitats. The observed patterns are indicative of an adaptive seasonal shift
  in parental investment in response to a deteriorating offspring environment: allocating greater
  resources to late‐produced offspring likely enhances maternal fitness.
10.1111/btp.12665: "Tropical biodiversity is under threat from a wide variety of anthropogenic stressors. Understanding the effect of major stressors—most notably land use change, over‐harvesting, emergence of novel pathogens, and climate change—is a major goal of tropical biology. However, to do so requires baseline data with which to compare present‐day patterns. Unfortunately, the tropics suffer from a lack of basic historical data; the few studies which have published such data have proven invaluable. In 1989, Fauth et\_al. described their studies of reptile and amphibian diversity and population demographics across tropical elevational gradients in Costa Rica. Since then, Fauth et\_al.'s basic ecological data have been widely used to document shifting patterns of species composition and abundance. Here, 30 years later, we argue that (a) collecting foundational ecological data remains incredibly important, especially in the tropics, and especially in those taxa which are generally understudied (e.g., reptiles and amphibians), (b) despite being one of the original goals of the 1989 study, the mechanisms driving biogeographical patterns of diversity remain unclear (both in the tropics and globally), and (c) that revisiting sites of historic biodiversity surveys—particularly those along gradients of environmental change—is incredibly important to our understanding of how tropical diversity is currently, and will continue to be, affected by activities in the Anthropocene. In its simplest terms, there has never been a time where the collection of basic data in the tropics has ever been more important."
10.1111/ddi.12517: >-
  It is critical that we understand the effects of climate change on natural systems if we ever hope
  to predict or mitigate consequent changes in diversity and ecosystem function. In order to
  identify coherent ‘fingerprints’ of climate change across Earth's terrestrial and marine
  ecosystems, various reviews have been conducted to synthesize studies of climate change impacts on
  individual species, assemblages and systems. These reviews help to make information about climate
  change impacts accessible for researchers as well as for the general public and policymakers. As
  such, these reviews can be highly influential in setting the direction of policy and research.
  Unfortunately, due to limited data availability, the majority of reviews of climate change impacts
  suffer from severe taxonomic and geographic biases. In particular, tropical and marine systems are
  grossly underrepresented, as are plants and endothermic animals. These biases may preclude a
  comprehensive understanding of how climate change is affecting Earth's natural systems at a global
  scale. In order to advance our understanding of climate change impacts on species and ecosystems,
  we need to first assess the types of data that are and are not available and then correct these
  biases through directed studies and initiatives.
