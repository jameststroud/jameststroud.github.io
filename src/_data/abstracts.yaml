10.21425/f5fbg22006: >-
  Temperature-change trajectories are being used to identify the geographic barriers and thermal
  ‘cul-de-sacs’ that will limit the ability of many species to track climate change by migrating. We
  argue that there are many other potential barriers to species’ migrations. These include stable
  ecotones, discordant shifts in climatic variables, human land use, and species’ limited dispersal
  abilities. To illustrate our argument, for each 0.5° latitude/longitude grid cell of the Earth’s
  land surface, we mapped and tallied the number of cells for which future (2060–2080) climate
  represents an analog of the focal cell’s current climate. We compared results when only
  considering temperature with those for which both temperature and total annual precipitation were
  considered in concert. We also compared results when accounting for only geographic barriers (no
  cross-continental migration) with those involving both geographic and potential ecological
  barriers (no cross-biome migration). As expected, the number of future climate analogs available
  to each pixel decreased markedly with each added layer of complexity (e.g. the proportion of the
  Earth’s land surface without any available future climate analogs increased from 3% to more than
  36% with the inclusion of precipitation and ecological boundaries). While including additional
  variables can increase model complexity and uncertainty, we must strive to incorporate the factors
  that we know will limit species’ ranges and migrations if we hope to predict the effects of
  climate change at a high-enough degree of accuracy to guide management decisions.
10.21425/f5fbg38649: >-
  The tropics have long been a focal point of interest in ecology and evolutionary biology - but
  where actually are the tropics? Classically, the tropics have been defined as all areas lying
  between 23.4° North and South as these zones receive direct overhead solar radiation at some point
  during the year. However, a suite of different environmental and climatic characteristics have
  also been employed to classify regions as tropical or not. The aims of this paper are to 1)
  briefly review some of the different criteria commonly used to define the tropics, 2) map the
  extent and distribution of tropical land areas according to these different criteria, and 3) asses
  the concordance between these criteria and a sample of recent “tropical” studies. More
  specifically, we review eight criteria that are frequently used (implicitly or explicitly) to
  define the tropics. We then map the location and extent of land areas that are “definitely
  tropical” (i.e., the core tropics) and areas that are “tropical by most definitions”. Finally, we
  examine how the different classifications apply to tropical research through an analysis of the
  study locations of >200 recent tropical biology articles. Depending on the definition, the extent
  of the terrestrial tropics ranges from 23 million to 66 million km2 – a nearly threefold
  difference. Likewise, the classification of many areas as being tropical vs. non-tropical depends
  on the specific criterion employed. Of the tropical studies reviewed here, only 44% were based on
  data collected from the core tropics, and 12% of tropical studies were based on data collected
  from sites outside of the geographic tropics but with tropical climates. Many different criteria
  are used to classify areas as tropical vs. non-tropical, leading to inconsistencies when
  estimating the extent of tropical areas and variation in the classification of ecosystems and
  species as being tropical vs. non-tropical.
10.32942/x2xp99: >-
  PyTLidar is an open-source Python package that reconstructs 3D tree Quantitative Structure Models
  (QSM) from Terrestrial Lidar Scanning (TLS) data, providing a user-friendly tool that improves and
  expands upon the MATLAB-based TreeQSM method. QSMs are used to automate detection and calculation
  of various topological and volumetric measurements that would normally take great effort to gather
  in the field. PyTLidar provides an accessible, extensible, and GUI-driven workflow for researchers
  and practitioners in forestry, ecology, and 3D vegetation modeling to create QSMs. The package
  also integrates interactive visualization tools for inspecting model quality and viewing
  calculated tree properties. The ease of use and installation of PyTLidar provides ecologists an
  option to gather forest measurements that does not rely on proprietary tools. The key features of
  PyTLidar are a reproduction of the TreeQSM core functionality, and enhancing the experience of
  setting up experiments and viewing results. It provides functionality for loading and extracting
  point cloud data from .las and .laz files as well as automatic calculation of a range of initial
  parameters for the QSM model based on point cloud structure. The QSM creation methods include
  generation of a Voronoi partition of the point cloud, segment detection, detection of parent-child
  relationships of branches, and cylinder fitting. PyTLidar also calculates various tree metrics
  such as branch length and volume and provides these results in text format as well as visual
  graphics. QSMs are also output in an interactive format which can be viewed directly in the GUI as
  well as saved and shared as an html file. All of this is packaged within a user-friendly GUI while
  also providing support for command line and direct Python interfacing.
10.64898/2026.06.10.731342: >-
  Community science platforms like iNaturalist generate unprecedented volumes of biodiversity data,
  but their scientific utility depends critically on accurate species identification—a persistent
  challenge when contributors often lack taxonomic expertise. We developed “

  <em>LizardLens</em>

  ”, a two-stage machine learning pipeline that decouples object detection from species
  classification to enable fine-grained identification of morphologically similar organisms in
  visually complex field photographs. Using 10,000 verified iNaturalist images of five

  <em>Anolis</em>

  lizard species in Florida, we trained specialized YOLO-based detection and Swin Transformer
  classification models and compared performance against state-of-the-art single-stage
  architectures. Our two-stage pipeline achieved 83.0% Top-1 accuracy and a macro-averaged F1-score
  of 89.0%, indicating strong precision-recall performance across species and outperforming
  single-stage YOLOv8 and YOLOv12 models across all evaluation metrics for all species, with
  relative improvements ranging from 10.5% to 13.2%. Gradient-weighted Class Activation Mapping
  (Grad-CAM) indicated that the model’s predictions were consistently associated with regions
  corresponding to diagnostic morphological (e.g., head shape, feet, and limb lengths) and pattern
  features (e.g., ocular rings and body patterning), providing evidence that LizardLens leverages
  biologically relevant visual cues consistent with those used by expert taxonomists. Error analysis
  identified partial occlusion and multiple proximate individuals as primary sources of missed
  detections, while spurious detections of lizard-like environmental features (e.g., sticks, bark)
  represented the dominant false positive error mode. We deployed LizardLens as an accessible web
  application featuring interactive bounding box correction, ranked species predictions with
  confidence scores, directly supporting the “

  <em>Lizards on the Loose</em>

  ” middle school community science initiative. By combining technical advances in fine-grained
  visual classification with user-centered design, LizardLens demonstrates how machine learning can
  simultaneously enhance data quality for biodiversity monitoring and provide authentic scientific
  experiences for student participants. Our approach is generalizable to other small-bodied
  organisms in complex habitats and provides a framework for translating computer vision advances
  into practical tools for community science and conservation.
10.64898/2026.06.10.731351: >-
  Morphological measurements underpin a wide range of ecological and evolutionary research, yet the
  manual landmarking workflows on which most morphometric studies depend remain a persistent
  bottleneck that limits both the pace and scale of biological research. Machine learning offers
  compelling solutions, but most automated landmarking tools require substantial computational
  expertise, creating a gap between technical capability and practical adoption by biologists. Here,
  we present LizardMorph, an integrated machine learning pipeline and web-based interface for
  semi-automated anatomical landmark detection on biological images. LizardMorph couples a
  fine-tuned ML-Morph shape predictor with an accessible, browser-based interface that enables
  researchers to upload images, review automated landmark predictions, interactively correct
  outliers through point-and-click editing, and export results in standard morphometric formats—all
  without programming expertise or local software installation. Using dorsal X-ray radiographs of

  <em>Anolis</em>

  lizards with 34 anatomical landmarks as a proof-of-concept, we show that the ML-Morph model
  achieves high predictive accuracy, with landmarks on well-defined skeletal structures predicted
  with 100% accuracy within a 1 mm tolerance threshold. A controlled user study comparing
  LizardMorph against traditional manual landmarking (TpsDig2) demonstrated significant efficiency
  gains: experienced annotators completed LizardMorph landmark verification 37.5% faster than manual
  annotation. Extrapolated to batch processing 1,000 lizards, LizardMorph saves experienced
  researchers approximately 6.5 hours of manual processing time. Critically, LizardMorph implements
  a human-in-the-loop design in which automated predictions serve as editable starting points,
  preserving researcher oversight and enabling correction of the occasional large-error outliers
  that would be unacceptable in fully automated workflows. LizardMorph is freely available as an
  open-source tool and provides a replicable framework for developing ML-assisted annotation tools
  that can democratize access to high-quality morphometric analysis across diverse biological
  research communities.
