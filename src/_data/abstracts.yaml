10.1146/annurev-ecolsys-121415-032254: >-
  The process of adaptive radiation—the proliferation of species from a single ancestor and
  diversification into many ecologically different forms—has been of great interest to evolutionary
  biologists since Darwin. Since the middle of the last century, ecological opportunity has been
  invoked as a potential key to understanding when and how adaptive radiation occurs. Interest in
  the topic of ecological opportunity has accelerated as research on adaptive radiation has
  experienced a resurgence, fueled in part by advances in phylogenetic approaches to studying
  evolutionary diversification. Nonetheless, what the term actually means, much less how it
  mechanistically leads to adaptive diversification, is currently debated; whether the term has any
  predictive value or is a heuristic useful only for post hoc explanation also remains unclear.
  Recent recognition that evolutionary change can occur rapidly and on a timescale commensurate with
  ecological processes suggests that it is time to synthesize ecological and evolutionary approaches
  to the study of community assembly and evolutionary diversification.
10.1670/0022-1511-55.3.215: >-
  Determining whether organisms have preferences for certain aspects of the habitat is important for
  understanding the process of habitat selection. <em>Anolis</em> lizards (anoles) have evolved to
  occupy distinct parts of the arboreal environment. Depending on the population or species, anoles
  perch on different aspects of the structural habitat varying in diameter, height, and type of
  substrate. We used laboratory and mesocosm trials to assess whether 2 species of <em>Anolis</em>
  lizards have preferences for the diameter and type of substrate they use for perching. Results
  reveal <em>A. cristatellus</em> and <em>A. sagrei</em> both prefer larger diameter perches.
  Lizards from natural forests and urban populations showed no difference in perch-diameter
  preference. In contrast, <em>A. sagrei</em> from an urban site overwhelmingly preferred to perch
  on wood substrates over polyvinyl chloride and metal ones. The larger diameter and wood substrates
  preferred by anoles in our trials should confer increased locomotor performance for these species
  based on previous studies. Rapid environmental change caused by humans can decouple the
  relationship between habitat preferences and fitness, so it is essential to test for changing
  preferences in organisms that experience urbanization and other forms of global change.
10.1670/23-043: >-
  Islands are the recipients of numerous invasive amphibians and reptiles, often resulting in
  negative impacts on native biodiversity. In the Caribbean, <em>Anolis</em> lizards, a well-studied
  system for their adaptive radiation, are also commonly introduced outside of their native range,
  which has resulted in reshaping species-area and species-isolation relationships. We used
  mitochondrial DNA (mtDNA) sequence data in a phylogeographic framework to reconstruct and compare
  invasion histories of four non-native <em>Anolis</em> species (<em>A. grahami</em>, <em>A.
  extremus</em>, <em>A. leachii</em>, and <em>A. sagrei</em>) established in Bermuda over the past
  120 years. Our findings support different invasion histories for the four species, including the
  number of native-range sources, genetic diversity, secondary introductions and opportunities for
  intraspecific hybridization between previously isolated lineages. The extent of population genetic
  structure in the native range and the mode of introduction (i.e., intentional vs. unintentional)
  may influence patterns of the invasion history and genetic diversity for introduced
  <em>Anolis</em> lizards in Bermuda. These results suggest that human-mediated introductions can
  create substantial variation in invasion dynamics, which in turn may influence fates of species in
  new environments.
