# ---------------------------------------------------------------------------
# MEDIA COVERAGE shown on each research story page (/research/<story>/)
#
# `outlets` sets the order: coverage is listed by the outlet's position in
# this list (most prestigious first), not by date. Add an outlet here before
# using it below; anything not listed goes to the end.
#
# Under `stories`, the key is the story's file name (e.g. cold-snaps).
#
#   - outlet: The New York Times
#     title: "Headline exactly as published"
#     date: 2025-10-21          # or just 2025 if the day is unknown
#     url: https://...
#     note: "Front page of the print edition"   # optional
#     byStroud: true            # optional: written by James rather than about him
# ---------------------------------------------------------------------------

outlets:
  - The New York Times
  - Science
  - The Washington Post
  - CNN
  - Scientific American
  - Smithsonian Magazine
  - Quanta Magazine
  - Science News
  - Atlas Obscura
  - South Florida Sun Sentinel
  - The Conversation
  - Phys.org

