# LAB NEWS
#
# Newest first. To post an update, copy a block to the top and edit it.
#
#   - date: 2026-08-27        # used for ordering, and shown unless dateText is set
#     dateText: "August 2026"  # optional: use when you only know month or year
#     title: "Headline"
